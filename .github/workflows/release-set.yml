name: Release set

on:
  pull_request:
    paths:
      - "london.toml"
      - "examples/**/Cargo.toml"
      - "newsletter/**"
      - ".github/workflows/release-set.yml"
  push:
    branches: [main]
    paths:
      - "london.toml"
      - "examples/**/Cargo.toml"
      - "newsletter/**"
      - ".github/workflows/release-set.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 declares the Node.js 24 runtime.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # v7.1.0 declares the Node.js 24 runtime.
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install ./newsletter
      - run: newsletter set check
        env:
          GH_TOKEN: ${{ github.token }}
