name: Items MCP example

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/items-mcp
    steps:
      # v7.0.1 declares the Node.js 24 runtime.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --check
      - run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.95.0 test --locked
      - run: cargo +1.95.0 build --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python walkthrough.py target/debug/items-mcp
