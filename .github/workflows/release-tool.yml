name: Release tool

on:
  pull_request:
    paths:
      - "pieces/tools/**"
      - ".github/workflows/release-tool.yml"
  push:
    branches: [main]
    paths:
      - "pieces/tools/**"
      - ".github/workflows/release-tool.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: pieces/tools
    steps:
      # v7.0.1 declares the Node.js 24 runtime.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # v7.1.0 declares the Node.js 24 runtime.
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8" "ruff>=0.17.3" "mypy>=2.4"
      - run: ruff format --check --line-length 120 .
      - run: ruff check --line-length 120 .
      - run: mypy --strict release.py
      - run: python -m pytest tests
