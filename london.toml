# The London Project's pieces, the release of each that the examples build against, and what the
# newsletter sends every piece. `newsletter sections` describes the section kinds and the tokens.

[london]
repository = "thirtytwobits/london"

[piece.clerkenwell]
repository = "thirtytwobits/clerkenwell"
tag = "v0.13.0"

[piece.walthamstow]
repository = "thirtytwobits/walthamstow"
tag = "v0.8.0"

[piece.battersea]
repository = "thirtytwobits/battersea"
tag = "v0.23.0"

[piece.clapham]
repository = "thirtytwobits/clapham"
tag = "v0.4.0"

[newsletter]
ref = "origin/main"
staging = ".newsletter"
branch-prefix = "newsletter/"

[newsletter.vars]
rust = "1.99.0"
msrv = "1.95"

[[newsletter.section]]
name = "agents"
kind = "block"
subject = "Update the shared agent instructions"
path = "AGENTS.md"
block = "shared"

[[newsletter.section]]
name = "spelling-dictionary"
kind = "file"
subject = "Update the London Project spelling dictionary"
path = ".vscode/london.dictionary.txt"

[[newsletter.section]]
name = "editor-settings"
kind = "structured"
subject = "Update the shared editor settings"
path = ".vscode/settings.json"
select = [
    "/cSpell.language",
    "/cSpell.allowCompoundWords",
    "/cSpell.caseSensitive",
    "/cSpell.customDictionaries",
]

[[newsletter.section]]
name = "dependabot"
kind = "structured"
subject = "Update the shared Dependabot configuration"
path = "pieces/.github/dependabot.yml"
target = ".github/dependabot.yml"
rules = { "/updates" = "merge-by:package-ecosystem" }

# The shared release process, sent to each piece as it adopts it.

[[newsletter.section]]
name = "release-tool"
kind = "file"
pieces = ["clerkenwell", "walthamstow", "battersea", "clapham"]
subject = "Update the shared release tool"
path = "pieces/tools/release.py"
target = "tools/release.py"

[[newsletter.section]]
name = "release-workflow"
kind = "file"
pieces = ["clerkenwell", "walthamstow", "battersea", "clapham"]
subject = "Update the shared release workflow"
path = "pieces/.github/workflows/release.yml"
target = ".github/workflows/release.yml"

[[newsletter.section]]
name = "verify-workflow"
kind = "file"
render = true
pieces = ["clerkenwell", "walthamstow", "battersea", "clapham"]
subject = "Update the shared release verification workflow"
path = "pieces/.github/workflows/verify.yml"
target = ".github/workflows/verify.yml"

[[newsletter.section]]
name = "release-procedure"
kind = "block"
render = true
pieces = ["clerkenwell", "walthamstow", "battersea", "clapham"]
subject = "Update the shared release procedure"
path = "pieces/RELEASING.md"
target = "RELEASING.md"
block = "releasing"

[[newsletter.section]]
name = "using-a-release"
kind = "block"
render = true
pieces = ["clerkenwell", "walthamstow", "battersea", "clapham"]
subject = "Update how to take a release"
path = "pieces/docs/using-a-release.md"
target = "docs/using-a-release.md"
block = "consuming"
