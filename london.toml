# The London Project's pieces, the release of each that the examples build against, and what the
# newsletter sends every piece. `newsletter sections` describes the section kinds.

[london]
repository = "thirtytwobits/london"

[piece.clerkenwell]
repository = "thirtytwobits/clerkenwell"
tag = "v0.9.0"

[piece.walthamstow]
repository = "thirtytwobits/walthamstow"
tag = "v0.1.0"

[piece.battersea]
repository = "thirtytwobits/battersea"
tag = "v0.15.1"

[piece.clapham]
repository = "thirtytwobits/clapham"
tag = "v0.2.0"

[newsletter]
ref = "origin/main"
staging = ".newsletter"
branch-prefix = "newsletter/"

[[newsletter.section]]
name = "agents"
kind = "block"
subject = "Update the shared agent instructions"
path = "AGENTS.md"
block = "shared"

[[newsletter.section]]
name = "spelling-dictionary"
kind = "file"
subject = "Update the London Project spelling dictionary"
path = ".vscode/london.dictionary.txt"

[[newsletter.section]]
name = "editor-settings"
kind = "structured"
subject = "Update the shared editor settings"
path = ".vscode/settings.json"
select = [
    "/cSpell.language",
    "/cSpell.allowCompoundWords",
    "/cSpell.caseSensitive",
    "/cSpell.customDictionaries",
]
