[package]
name = "micro"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT"

[dependencies]
clapham = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.7.0" }
clapham-cli = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.7.0" }
clapham-mcp-server = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.7.0" }
clerkenwell-axum = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.16.0" }
clerkenwell-events = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.16.0" }
clerkenwell-ops = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.16.0" }
clerkenwell-schema = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.16.0" }
clerkenwell-session = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.16.0" }
clerkenwell-store = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.16.0" }
walthamstow-kernel = { git = "https://github.com/thirtytwobits/walthamstow", tag = "v0.13.0" }
walthamstow-ops = { git = "https://github.com/thirtytwobits/walthamstow", tag = "v0.13.0" }
walthamstow-workspace = { git = "https://github.com/thirtytwobits/walthamstow", tag = "v0.13.0" }
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.54.1", features = ["io-util", "rt"] }

[dev-dependencies]
clerkenwell-codegen = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.16.0" }
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros"] }

[lints.rust]
unsafe_code = "forbid"
