[package]
name = "micro"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT"

[dependencies]
clapham = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.6.0" }
clapham-cli = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.6.0" }
clapham-mcp-server = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.6.0" }
clerkenwell-axum = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.14.0" }
clerkenwell-events = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.14.0" }
clerkenwell-ops = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.14.0" }
clerkenwell-schema = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.14.0" }
clerkenwell-session = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.14.0" }
clerkenwell-store = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.14.0" }
walthamstow-kernel = { git = "https://github.com/thirtytwobits/walthamstow", tag = "v0.10.1" }
walthamstow-ops = { git = "https://github.com/thirtytwobits/walthamstow", tag = "v0.10.1" }
walthamstow-workspace = { git = "https://github.com/thirtytwobits/walthamstow", tag = "v0.10.1" }
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.54.1", features = ["io-util", "rt"] }

[dev-dependencies]
clerkenwell-codegen = { git = "https://github.com/thirtytwobits/clerkenwell", tag = "v0.14.0" }
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros"] }

[lints.rust]
unsafe_code = "forbid"

# Clerkenwell's crates build on a Loro fork, and patches do not propagate to dependents: this
# workspace carries Clerkenwell's override, at the Loro revision its release names.
[patch.crates-io]
generic-btree = { git = "https://github.com/thirtytwobits/loro.git", rev = "704cfb2bdb158bcd2910948ad140eb24713f35a1" }
