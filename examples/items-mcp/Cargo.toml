[package]
name = "items-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[dependencies]
axum = "0.8.6"
clapham = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.3.3" }
clapham-mcp-server = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.3.3" }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std", "net", "signal"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "process"] }

[lints.rust]
unsafe_code = "forbid"
