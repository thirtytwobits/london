# Sent by the newsletter from thirtytwobits/london; change it there.
name: Dependencies

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/dependencies.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/dependencies.yml'
  schedule:
    - cron: '40 6 * * *'

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # v7.0.1; action.yml declares runs.using: node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v2.1.3; action.yml declares runs.using: docker, which runs cargo-deny 0.22.0.
      - name: Refuse yanked crates and advisories in the lockfile
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd
        with:
          command: check advisories
